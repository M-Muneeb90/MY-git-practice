<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muneeb's 3D Vault 🔒</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #05070e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      perspective: 1000px;
    }

    /* 3D Moving Neon Lights Background */
    .light {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.65;
      z-index: 0;
      animation: moveLights 8s infinite alternate ease-in-out;
    }
    .light-1 {
      width: 320px; height: 320px;
      background: #7c3aed;
      top: -60px; left: -60px;
    }
    .light-2 {
      width: 350px; height: 350px;
      background: #06b6d4;
      bottom: -80px; right: -60px;
      animation-delay: 2s;
    }
    .light-3 {
      width: 220px; height: 220px;
      background: #ec4899;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 6s;
    }

    @keyframes moveLights {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -40px) scale(1.2); }
    }

    /* 3D Glass Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 40px 30px;
      border-radius: 26px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(56, 189, 248, 0.15);
      width: 350px;
      text-align: center;
      transform-style: preserve-3d;
      animation: cardFloat 4s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotateX(2deg) rotateY(-2deg); }
      50% { transform: translateY(-12px) rotateX(-2deg) rotateY(2deg); }
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #e879f9, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(2, 6, 23, 0.75);
      color: #fff;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: 0.3s;
    }
    input::placeholder {
      color: rgba(148, 163, 184, 0.45);
      letter-spacing: 1px;
      font-size: 14px;
    }
    input:focus {
      border-color: #e879f9;
      box-shadow: 0 0 20px rgba(232, 121, 249, 0.5);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.5);
    }
    button:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 30px rgba(236, 72, 153, 0.7);
    }

    .error {
      color: #fb7185;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* 3D Meme Screen */
    .meme-screen { display: none; }
    .floating-3d-object {
      font-size: 85px;
      display: inline-block;
      margin: 10px 0;
      filter: drop-shadow(0 15px 25px rgba(236, 72, 153, 0.7));
      animation: spin3D 3s infinite ease-in-out;
    }

    @keyframes spin3D {
      0%, 100% { transform: translateY(0) rotateY(-18deg) scale(1); }
      50% { transform: translateY(-15px) rotateY(18deg) scale(1.12); }
    }

    .meme-pic {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 2px solid #e879f9;
      display: none; /* Jab meme.jpg upload hogi to khud dikhegi */
    }

    .meme-title {
      font-size: 22px;
      font-weight: 800;
      color: #facc15;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
      margin-top: 8px;
    }

    .back-btn {
      background: rgba(51, 65, 85, 0.8);
      box-shadow: none;
      margin-top: 18px;
    }
    .back-btn:hover { background: #475569; box-shadow: none; }
  </style>
</head>
<body>

  <!-- 3D Background Lights -->
  <div class="light light-1"></div>
  <div class="light light-2"></div>
  <div class="light light-3"></div>

  <!-- Lock Screen -->
  <div class="card" id="lockScreen">
    <div class="badge">VIP ACCESS 🔒</div>
    <h1>Muneeb's 3D Vault</h1>
    <p>Secret code enter karein</p>
    <input type="password" id="passInput" placeholder="Hint: 12" onkeypress="if(event.key==='Enter') unlock()">
    <button onclick="unlock()">Unlock Now ⚡</button>
    <div class="error" id="errorMsg">❌ Galat code! Hint dekhein: 12</div>
  </div>

  <!-- Meme Screen -->
  <div class="card meme-screen" id="memeScreen">
    <div class="badge" style="color:#facc15; border-color:#facc15;">GOTCHA 😂</div>

    <!-- Agar aap meme.jpg upload karenge to yahan dikhegi -->
    <img src="meme.jpg" alt="Meme" class="meme-pic" onload="this.style.display='block'">

    <!-- 3D Floating Joker & Emoji -->
    <div class="floating-3d-object">🤡🖕🏻</div>

    <div class="meme-title">Muneeb Bhai Ki Taraf Se Special Gift! 😂</div>
    <button class="back-btn" onclick="lockAgain()">Wapas Lock Karein 🔒</button>
  </div>

  <!-- Optional Audio File (Agar aap sound.mp3 upload karein) -->
  <audio id="prankAudio" src="sound.mp3"></audio>

  <script>
    function unlock() {
      const pass = document.getElementById('passInput').value;
      const error = document.getElementById('errorMsg');

      if (pass === "12") {
        document.getElementById('lockScreen').style.display = "none";
        document.getElementById('memeScreen').style.display = "block";
        error.style.display = "none";
        playSound();
      } else {
        error.style.display = "block";
      }
    }

    function playSound() {
      const audio = document.getElementById('prankAudio');
      // Pehle sound.mp3 chalane ki koshish karega; agar file nahi hui to browser ki voice bolegi
      audio.play().catch(() => {
        const msg = new SpeechSynthesisUtterance("Surprise! Muneeb Bhai ki taraf se special gift!");
        msg.rate = 1;
        msg.pitch = 1.1;
        window.speechSynthesis.speak(msg);
      });
    }

    function lockAgain() {
      const audio = document.getElementById('prankAudio');
      audio.pause();
      audio.currentTime = 0;
      document.getElementById('memeScreen').style.display = "none";
      document.getElementById('lockScreen').style.display = "block";
      document.getElementById('passInput').value = "";
    }
  </script>

</body>
</html>
