<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muneeb Bhai - Live Portal</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 320px;
      text-align: center;
      border: 1px solid #334155;
    }
    h2 { color: #38bdf8; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #0284c7; color: white; }
    .error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }
    .dashboard { display: none; }
    .logout-btn { background: #ef4444; color: white; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- Login Box -->
  <div class="card" id="loginBox">
    <h2>Muneeb Portal</h2>
    <p>Aage jane ke liye login karein</p>
    <input type="text" id="username" placeholder="Username (muneeb)">
    <input type="password" id="password" placeholder="Password (1234)">
    <button onclick="login()">Login Karein</button>
    <div class="error" id="errorMsg">Ghalat Username ya Password!</div>
  </div>

  <!-- Dashboard Box (Login ke baad dikhega) -->
  <div class="card dashboard" id="dashboardBox">
    <h2>🎉 Khush Amdeed!</h2>
    <p>Assalam-o-Alaikum <b>Muneeb Bhai</b>! Aapki CI/CD pipeline aur live website bilkul sahi kaam kar rahi hai.</p>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <script>
    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (user === "muneeb" && pass === "1234") {
        document.getElementById('loginBox').style.display = "none";
        document.getElementById('dashboardBox').style.display = "block";
        errorMsg.style.display = "none";
      } else {
        errorMsg.style.display = "block";
      }
    }

    function logout() {
      document.getElementById('dashboardBox').style.display = "none";
      document.getElementById('loginBox').style.display = "block";
      document.getElementById('username').value = "";
      document.getElementById('password').value = "";
    }
  </script>

</body>
</html>
