<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUNEEB // JARVIS COMMAND CENTER ⚡</title>
  <style>
    @import url('https://googleapis.com');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Share Tech Mono', monospace;
      background: #02040a;
      color: #00f3ff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    canvas#holoCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .scanline {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 243, 255, 0.04) 50%);
      background-size: 100% 4px;
    }
    .hud-container {
      position: relative; z-index: 2; width: 100%; max-width: 440px;
      background: rgba(5, 12, 26, 0.78); backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 243, 255, 0.45); border-radius: 22px;
      padding: 28px 24px; box-shadow: 0 0 45px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #38bdf8; margin-bottom: 14px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 10px; }
    .status-dot { display: inline-block; width: 9px; height: 9px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; margin-right: 6px; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }
    h1 {
      font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; text-align: center;
      background: linear-gradient(90deg, #00f3ff, #e879f9, #ffe600); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 2px; margin-bottom: 6px;
    }
    .subtitle { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
    .terminal-box {
      background: rgba(1, 4, 12, 0.9); border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 12px; padding: 12px; height: 115px; overflow: hidden;
      font-size: 12px; color: #22c55e; line-height: 1.5; margin-bottom: 18px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
    }
    .scanner-section { margin-bottom: 18px; }
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(0, 243, 255, 0.4);
      background: rgba(2, 6, 23, 0.9); color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 14px; outline: none;
    }
    input:focus { border-color: #e879f9; box-shadow: 0 0 15px rgba(232, 121, 249, 0.4); }
    .btn {
      padding: 12px 16px; border: none; border-radius: 10px; font-family: 'Orbitron', sans-serif;
      font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.25s; letter-spacing: 1px;
    }
    .scan-btn { background: #00f3ff; color: #02040a; box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
    .scan-btn:hover { transform: scale(1.04); background: #38bdf8; }
    .scan-result {
      margin-top: 10px; padding: 10px; border-radius: 10px; background: rgba(232, 121, 249, 0.12);
      border: 1px dashed #e879f9; color: #facc15; font-size: 13px; display: none; text-align: center;
    }
    .overdrive-btn {
      width: 100%; padding: 15px; font-size: 14px; color: #02040a;
      background: linear-gradient(90deg, #00f3ff, #ff00ea, #ffe600); background-size: 200% auto;
      box-shadow: 0 0 25px rgba(255, 0, 234, 0.5); animation: flow 3s linear infinite;
    }
    @keyframes flow { 100% { background-position: 200% 50%; } }
    .overdrive-btn:hover { transform: scale(1.03); box-shadow: 0 0 35px rgba(0, 243, 255, 0.8); }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; text-align: center; }
    .stat-card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 10px; padding: 8px; }
    .stat-val { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #ffe600; font-weight: bold; }
    .stat-lbl { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-4px); } }
  </style>
</head>
<body>
  <canvas id="holoCanvas"></canvas>
  <div class="scanline"></div>

  <!-- Chupi hui video sirf mp3.mp4 ki awaaz bajane ke liye -->
  <video id="bgVoice" src="mp3.mp4" playsinline loop style="display:none;"></video>

  <div class="hud-container" id="hudBox">
    <div class="top-bar">
      <span><span class="status-dot"></span>MUNEEB_OS v9.9</span>
      <span id="liveClock">00:00:00</span>
    </div>
    <h1>JARVIS CORE</h1>
    <div class="subtitle">AUTONOMOUS CI/CD & NEURAL COMMAND</div>

    <div class="terminal-box" id="terminal"></div>

    <div class="scanner-section">
      <div class="input-row">
        <input type="text" id="targetName" placeholder="Classmate ka naam likhein...">
        <button class="btn scan-btn" onclick="scanTarget()">SCAN 🎯</button>
      </div>
      <div class="scan-result" id="scanResult"></div>
    </div>

    <button class="btn overdrive-btn" id="odBtn" onclick="toggleOverdrive()">⚡ ACTIVATE OVERDRIVE + AUDIO ⚡</button>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val">99.9%</div><div class="stat-lbl">CI/CD UPTIME</div></div>
      <div class="stat-card"><div class="stat-val" id="fpsVal">120 FPS</div><div class="stat-lbl">3D ENGINE</div></div>
      <div class="stat-card"><div class="stat-val">GOD</div><div class="stat-lbl">ACCESS LVL</div></div>
    </div>
  </div>

  <script>
    setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleTimeString(); }, 1000);

    const logs = [
      "> Initializing Muneeb Neural Core...",
      "> GitHub Actions CI/CD Pipeline: VERIFIED [OK]",
      "> Bypassing Classmate Firewall... 100%",
      "> 3D Hologram Engine: ONLINE",
      "> Waiting for Commander Muneeb's order..."
    ];
    let logIdx = 0;
    const term = document.getElementById('terminal');
    function typeLogs() {
      if (logIdx < logs.length) {
        const line = document.createElement('div');
        line.innerText = logs[logIdx++];
        term.appendChild(line);
        setTimeout(typeLogs, 650);
      }
    }
    typeLogs();

    const reports = [
      "Brain Power: 2% | Chai Addiction: 98% ☕",
      "Threat Level: ZERO | Sirf baatein badi hain 😂",
      "Status: Exam se 1 raat pehle parhne wala legend 📚",
      "Alert: VIP Banda detected — Respect +100 🔥",
      "System Error: Itna confidence kahan se aata hai? 🤯"
    ];
    function scanTarget() {
      const name = document.getElementById('targetName').value.trim();
      const res = document.getElementById('scanResult');
      if (!name) return;
      res.style.display = "block";
      res.innerText = `Scanning ${name.toUpperCase()}...`;
      setTimeout(() => {
        const pick = reports[Math.floor(Math.random() * reports.length)];
        res.innerText = `🎯 [${name.toUpperCase()}]: ${pick}`;
      }, 600);
    }

    let overdrive = false;
    function toggleOverdrive() {
      overdrive = !overdrive;
      const box = document.getElementById('hudBox');
      const voice = document.getElementById('bgVoice');
      const btn = document.getElementById('odBtn');
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');

      if (overdrive) {
        btn.innerText = "🔥 OVERDRIVE ACTIVE (STOP) 🔥";
        voice.play().catch(() => {});
      } else {
        btn.innerText = "⚡ ACTIVATE OVERDRIVE + AUDIO ⚡";
        voice.pause();
      }
    }

    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

    let dots = [], angle = 0;
    for (let i = 0; i < 160; i++) {
      const theta = Math.acos(2 * Math.random() - 1), phi = 2 * Math.PI * Math.random();
      dots.push({ x: Math.sin(theta) * Math.cos(phi), y: Math.sin(theta) * Math.sin(phi), z: Math.cos(theta) });
    }
    function drawSphere() {
      ctx.fillStyle = "rgba(2, 4, 10, 0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      angle += overdrive ? 0.045 : 0.01;
      const radius = Math.min(canvas.width, canvas.height) * (overdrive ? 0.42 : 0.34);
      const cx = canvas.width / 2, cy = canvas.height / 2;

      dots.forEach((d, idx) => {
        const rx = d.x * Math.cos(angle) - d.z * Math.sin(angle);
        const rz = d.z * Math.cos(angle) + d.x * Math.sin(angle);
        const scale = 300 / (300 + rz * radius);
        const px = cx + rx * radius * scale, py = cy + d.y * radius * scale;

        ctx.beginPath();
        ctx.arc(px, py, (overdrive ? 3 : 2) * scale, 0, Math.PI * 2);
        ctx.fillStyle = overdrive ? (idx % 2 === 0 ? "#ff00ea" : "#ffe600") : "#00f3ff";
        ctx.fill();
      });
      requestAnimationFrame(drawSphere);
    }
    drawSphere();
  </script>
</body>
</html>
